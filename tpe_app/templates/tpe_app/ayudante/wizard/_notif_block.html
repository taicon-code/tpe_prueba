<!-- Bloque de notificación reutilizable. Requiere: prefix -->
<div class="card bg-light mt-3">
    <div class="card-header bg-info text-white">
        <h6 class="mb-0"><i class="bi bi-bell me-1"></i>Datos de Notificación (opcional)</h6>
    </div>
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Tipo de Notificación</label>
                <select name="{{ prefix }}_notif_tipo" class="form-select">
                    <option value="">— Sin notificación —</option>
                    <option value="FIRMA">Firma</option>
                    <option value="EDICTO">Edicto</option>
                    <option value="CEDULON">Cedulón</option>
                </select>
            </div>
            <div class="col-md-8">
                <label class="form-label">Notificado a</label>
                <input type="text" name="{{ prefix }}_notif_notificado_a" class="form-control"
                       placeholder="Persona / dirección">
            </div>
        </div>
        <div class="row g-3 mt-1">
            <div class="col-md-4">
                <label class="form-label">Fecha</label>
                <input type="date" name="{{ prefix }}_notif_fecha" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Hora</label>
                <input type="time" name="{{ prefix }}_notif_hora" class="form-control">
            </div>
        </div>
    </div>
</div>
